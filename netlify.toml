# Netlify — frontend React/Vite da IPAJ Gaming (monorepo).
# Este arquivo fica na RAIZ do repositório; "base" aponta para frontend/, e os caminhos
# "publish" e "command" são relativos a essa base (publish = frontend/dist).
# O backend FastAPI + Apriori NÃO roda aqui: ele fica no Render (render.yaml).

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # VITE_API_URL NÃO fica aqui: configure no painel do Netlify
  # (Site configuration > Environment variables) com a URL pública do Render.
  # Variáveis VITE_ vão para o bundle público: nunca coloque segredos nelas.

# Fallback de SPA: /catalogo, /carrinho, /laboratorio, /produto/P001... servem o index.html.
# Arquivos existentes (ex.: /assets/*.js, /favicon.svg) têm prioridade, pois não usamos force.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Arquivos com hash no nome (gerados pelo Vite) podem ser cacheados para sempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
