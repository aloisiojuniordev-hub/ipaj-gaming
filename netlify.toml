# Netlify — frontend React/Vite da IPAJ Gaming (monorepo).
# Este arquivo fica na RAIZ do repositório; "base" aponta para frontend/, e os caminhos
# "publish" e "command" são relativos a essa base (publish = frontend/dist).
# Sem servidor Python: as regras Apriori (geradas em Python/mlxtend) vêm em frontend/src/data,
# e login/pedidos usam o Supabase com a chave pública (ver docs/deployment.md).

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # URL do projeto Supabase (pública).
  VITE_SUPABASE_URL = "https://lvukeuyexxewmnslucwj.supabase.co"
  # VITE_SUPABASE_PUBLISHABLE_KEY: configure no painel do Netlify (Environment variables).
  # É a chave PÚBLICA (sb_publishable_...). Nunca use a secret/service_role: VITE_ vai para o bundle.

# Fallback de SPA: /catalogo, /carrinho, /laboratorio, /produto/P001... servem o index.html.
# Arquivos existentes (ex.: /assets/*.js, /favicon.svg) têm prioridade, pois não usamos force.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Arquivos com hash no nome (gerados pelo Vite) podem ser cacheados para sempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
